<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link rel="stylesheet" href="feedback.css" />
  </head>
  <body>
    <header>
      <h1>Jens Portfolio - Feedback</h1>
    </header>
    <main>
      <section id="feedback-section">
        <div class="form-header">
          <h2>Send Feedback</h2>
          <p>
            We value your feedback! Please fill out the form below to share your
            thoughts and suggestions.
          </p>
        </div>

        <form id="feedback-form" novalidate>
          <label for="name">Full name:</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            aria-describedby="name-error"
          />
          <span class="error-message" id="name-error"></span>

          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            aria-describedby="email-error"
          />
          <span class="error-message" id="email-error"></span>

          <label for="feedback-topic">Topic of interest:</label>
          <select
            id="feedback-topic"
            name="feedback-topic"
            required
            aria-describedby="topic-error"
          >
            <option value="">Choose topic..</option>
            <option value="bug">Bug Report</option>
            <option value="feature">Feature Request</option>
            <option value="general">General Feedback</option>
          </select>
          <span class="error-message" id="topic-error"></span>
          <label for="message">Message:</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            required
            aria-describedby="message-counter message-error"
          ></textarea>
          <span id="message-counter" class="character-counter"></span>
          <span class="error-message" id="message-error"></span>

          <label for="website">Website (optional):</label>
          <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
            aria-describedby="website-error"
          />
          <span class="error-message" id="website-error"></span>
          <div class="form-buttons">
            <button type="submit" id="btnSubmit">Submit</button>
            <button type="reset" id="btnClear">Clear</button>
          </div>
          <span
            id="form-success"
            class="form-success"
            role="status"
            aria-live="polite"
          ></span>
        </form>
      </section>
    </main>
    <footer>
      <!-- Copyright as per assignment -->
      <p>&copy; 2026 Jens Portfolio. All rights reserved.</p>
      <!-- Contact, policy and terms of service placeholder as per assignment -->
      <p>
        <a href="mailto:jens.lahti0176@stud.hkr.se">Contact me</a>
        <span aria-hidden="true">|</span>
        <a href="#">Privacy Policy</a>
        <span aria-hidden="true">|</span>
        <a href="#">Terms of Service</a>
      </p>
    </footer>
    <script src="feedback.js"></script>
  </body>
</html>
